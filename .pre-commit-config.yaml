repos:
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.6
    hooks:
      - id: docformatter
        args: [--in-place, --recursive]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        name: ruff-fix
        args: [--fix, --output-format=concise ]

      - id: ruff-format

      - id: ruff
        name: ruff-check
        args: [--no-fix, --output-format=concise]
