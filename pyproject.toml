[project]
name = "project_sgil"
version = "0.1.0"
description = "A tree-based localization method"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "pandas",
    "matplotlib",
    "shapely",
    "numpy",
    "sympy",
    "OSMPythonTools",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "docformatter",
    "pandas",
]

[tool.ruff]
line-length = 100
target-version = "py310"
show-fixes = true
unsafe-fixes = true

[tool.ruff.lint]
ignore = [
    "PLR2004",
    "PLR0911",
    "T201",
    "D",
#    TODO: probably want these two back in
    "PLR0912",
    "PLR0915",
]
extend-ignore = [
    "D100",
    "D104",
]
select = [
    "E", "F", "I", "PL", "UP", "RUF", "B", "C4", "SIM", "ANN"
]
extend-select = [
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
]

fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.docformatter]
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true
make-summary-multi-line = true
recursive = true
in-place = true
