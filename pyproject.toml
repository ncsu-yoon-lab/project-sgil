[project]
name = "project_sgil"
version = "0.1.0"
description = "A tree-based localization method"
requires-python = "==3.12.*"
dependencies = [
    "opencv-python",
    "pandas",
    "matplotlib",
    "shapely",
    "numpy",
    "deepforest",
    "torch",
    "torchvision",
    "torchaudio",
    "sympy",
    "OSMPythonTools",
    "scipy",
    "PyYAML",
    "earthengine-api",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "docformatter",
    "pandas",
]

[tool.uv]
override-dependencies = [
    "albumentations==1.4.24",
]

[tool.ruff]
line-length = 100
target-version = "py310"
show-fixes = true
unsafe-fixes = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff.lint]
ignore = [
    "PLR2004",
    "PLR0911",
    "T201",
    "T203",
    "D",
    "PLR0912",
    "PLR0915",
]
extend-ignore = [
    "D100",
    "D104",
]
select = [
    "E", "F", "I", "PL", "UP", "RUF", "B", "C4", "SIM", "ANN"
]
extend-select = [
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
]

fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
